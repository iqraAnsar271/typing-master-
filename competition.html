<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Race a friend in real-time typing competition. Same quote, same clock — whoever types fastest wins.">
  <title>Competition — Type Like Sherlock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-competition">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <nav class="site-nav">
    <span class="nav-brand">TYPE LIKE SHERLOCK</span>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="practice.html" class="nav-link">Practice</a>
      <a href="competition.html" class="nav-link nav-link-active">Competition</a>
      <a href="leaderboard.html" class="nav-link">Leaderboard</a>
      <a href="profile.html" class="nav-link">Profile</a>
    </div>
  </nav>

  <section class="multiplayer-panel" id="multiplayer-panel">
    <p class="mp-eyebrow">Competition Mode</p>
    <h2 class="mp-heading">RACE A FRIEND<span class="cursor">_</span></h2>
    <p class="mp-tagline">Same quote, same clock. Whoever deduces fastest wins.</p>

    <div class="mp-card">
      <input type="text" id="mp-name" placeholder="Your name" autocomplete="off">
      <div class="mp-actions">
        <button type="button" id="mp-create">Create Room</button>
        <input type="text" id="mp-room-code" placeholder="Room code" maxlength="4" autocomplete="off">
        <button type="button" id="mp-join">Join Room</button>
        <button type="button" id="mp-spectate" class="secondary-btn">👁️ Spectate Race</button>
      </div>
      <p id="mp-status" class="mp-status"></p>
      <div id="mp-countdown" class="mp-countdown"></div>
      <ul id="mp-players" class="mp-players"></ul>
    </div>
  </section>

  <!-- Spectator View Container -->
  <section class="spectator-section" id="spectator-section" style="display:none;">
    <div class="spectator-view" id="spectator-view"></div>
    <div class="spectator-actions" style="text-align: center; margin-top: 1.5rem;">
      <button type="button" id="spectator-exit-btn" class="hero-cta secondary">Exit Spectator Mode</button>
    </div>
  </section>

  <main class="game-shell" id="game-shell" data-difficulty="easy">
    <header class="top-bar">
      <div>
        <h1>Race track</h1>
        <p class="intro">Join a room above, then wait for both players to be ready.</p>
      </div>
      <div class="difficulty-panel" aria-live="polite">
        <span class="difficulty-label">Difficulty</span>
        <span id="difficulty-level" class="difficulty-badge easy" aria-label="Current difficulty level">Easy</span>
      </div>
    </header>

    <div class="stats" aria-live="polite" role="status" aria-atomic="true">
      <div class="stat-card">
        <span class="stat-label">WPM</span>
        <strong id="wpm-stat">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Accuracy</span>
        <strong id="accuracy-stat">100%</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Streak</span>
        <strong id="streak-stat">0</strong>
      </div>
    </div>
    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Quote completion progress">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <p id="race-timer" class="race-timer"></p>
    <p id="quote" class="quote" aria-live="polite" aria-label="Quote to type"></p>
    <p id="message" class="message" role="status" aria-live="polite" aria-atomic="true"></p>

    <div class="input-row">
      <label class="sr-only" for="typed-value">Type the highlighted text</label>
      <input
        type="text"
        id="typed-value"
        aria-label="Type the highlighted text"
        aria-describedby="message"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      >
      <button type="button" id="start" aria-label="Start a new typing round">Start</button>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
  <script src="multiplayer.js"></script>
  <script src="spectator.js"></script>
  <script src="bg-animations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const specBtn = document.getElementById('mp-spectate');
      const exitBtn = document.getElementById('spectator-exit-btn');
      const specSec = document.getElementById('spectator-section');
      const gameShell = document.getElementById('game-shell');
      const mpPanel = document.getElementById('multiplayer-panel');

      if (specBtn) {
        specBtn.addEventListener('click', () => {
          specSec.style.display = 'block';
          gameShell.style.display = 'none';
          mpPanel.style.display = 'none';
          if (window.Spectator) window.Spectator.start();
        });
      }

      if (exitBtn) {
        exitBtn.addEventListener('click', () => {
          specSec.style.display = 'none';
          gameShell.style.display = 'block';
          mpPanel.style.display = 'block';
          if (window.Spectator) window.Spectator.stop();
        });
      }
    });
  </script>
</body>
</html>
