<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Type Like Sherlock</title>
  <meta name="description" content="Sign in or create your account to track your typing progress and compete on the leaderboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <nav class="site-nav">
    <a href="index" class="nav-brand">TYPE LIKE SHERLOCK</a>
    <div class="nav-links">
      <a href="index" class="nav-link">Home</a>
      <a href="practice" class="nav-link">Practice</a>
      <a href="competition" class="nav-link">Competition</a>
      <a href="leaderboard" class="nav-link">Leaderboard</a>
      <a href="profile" class="nav-link">Profile</a>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <!-- Decorative badge -->
      <div class="auth-badge">🔐</div>

      <h1 class="auth-title" id="auth-title">Welcome Back</h1>
      <p class="auth-subtitle" id="auth-subtitle">Sign in to track your progress</p>

      <!-- Tab Toggle -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" type="button">Login</button>
        <button class="auth-tab" id="tab-register" type="button">Register</button>
        <div class="auth-tab-indicator" id="tab-indicator"></div>
      </div>

      <!-- Error / Success Message -->
      <div class="auth-message" id="auth-message" role="alert"></div>

      <!-- Login Form -->
      <form class="auth-form" id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="login-email">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">📧</span>
            <input type="email" id="login-email" name="email" placeholder="detective@example.com" required autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔑</span>
            <input type="password" id="login-password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="toggle-password" id="toggle-login-pw" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>
        <button type="submit" class="auth-submit" id="login-submit">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader" hidden>⏳</span>
        </button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="register-form" style="display: none;" autocomplete="on">
        <div class="form-group">
          <label for="register-username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">🕵️</span>
            <input type="text" id="register-username" name="username" placeholder="SherlockTypist" required minlength="3" maxlength="24" autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">📧</span>
            <input type="email" id="register-email" name="email" placeholder="detective@example.com" required autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label for="register-password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔑</span>
            <input type="password" id="register-password" name="password" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password">
            <button type="button" class="toggle-password" id="toggle-register-pw" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label for="register-confirm">Confirm Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔐</span>
            <input type="password" id="register-confirm" name="confirmPassword" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
          </div>
        </div>
        <button type="submit" class="auth-submit" id="register-submit">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader" hidden>⏳</span>
        </button>
      </form>

      <p class="auth-footer" id="auth-footer">
        Don't have an account? <button type="button" class="auth-switch" id="switch-to-register">Create one</button>
      </p>
    </div>
  </main>

  <script src="bg-animations.js"></script>
  <script src="auth.js"></script>
  <script>
    (() => {
      // If already logged in, redirect
      if (Auth.isLoggedIn()) {
        window.location.href = Auth.isAdmin() ? "admin" : "dashboard";
        return;
      }

      const loginForm = document.getElementById("login-form");
      const registerForm = document.getElementById("register-form");
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const authTitle = document.getElementById("auth-title");
      const authSubtitle = document.getElementById("auth-subtitle");
      const authFooter = document.getElementById("auth-footer");
      const authMessage = document.getElementById("auth-message");

      let currentTab = "login";

      function switchTab(tab) {
        currentTab = tab;
        if (tab === "login") {
          loginForm.style.display = "";
          registerForm.style.display = "none";
          tabLogin.classList.add("active");
          tabRegister.classList.remove("active");
          authTitle.textContent = "Welcome Back";
          authSubtitle.textContent = "Sign in to track your progress";
          authFooter.innerHTML = `Don't have an account? <button type="button" class="auth-switch" id="switch-to-register">Create one</button>`;
          document.getElementById("switch-to-register").onclick = () => switchTab("register");
        } else {
          loginForm.style.display = "none";
          registerForm.style.display = "";
          tabLogin.classList.remove("active");
          tabRegister.classList.add("active");
          authTitle.textContent = "Join the Case";
          authSubtitle.textContent = "Create your detective account";
          authFooter.innerHTML = `Already have an account? <button type="button" class="auth-switch" id="switch-to-login">Sign in</button>`;
          document.getElementById("switch-to-login").onclick = () => switchTab("login");
        }
        hideMessage();
      }

      tabLogin.onclick = () => switchTab("login");
      tabRegister.onclick = () => switchTab("register");
      document.getElementById("switch-to-register").onclick = () => switchTab("register");

      function showMessage(text, type = "error") {
        authMessage.textContent = text;
        authMessage.className = `auth-message ${type}`;
        authMessage.style.display = "block";
      }

      function hideMessage() {
        authMessage.style.display = "none";
      }

      function setLoading(form, loading) {
        const btn = form.querySelector(".auth-submit");
        const btnText = btn.querySelector(".btn-text");
        const btnLoader = btn.querySelector(".btn-loader");
        btn.disabled = loading;
        btnText.hidden = loading;
        btnLoader.hidden = !loading;
      }

      // Login
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideMessage();
        setLoading(loginForm, true);

        try {
          const email = document.getElementById("login-email").value.trim();
          const password = document.getElementById("login-password").value;
          const data = await Auth.login(email, password);

          showMessage("Login successful! Redirecting...", "success");
          setTimeout(() => {
            window.location.href = data.role === "admin" ? "admin" : "dashboard";
          }, 600);
        } catch (err) {
          showMessage(err.message);
        } finally {
          setLoading(loginForm, false);
        }
      });

      // Register
      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideMessage();

        const username = document.getElementById("register-username").value.trim();
        const email = document.getElementById("register-email").value.trim();
        const password = document.getElementById("register-password").value;
        const confirm = document.getElementById("register-confirm").value;

        if (password !== confirm) {
          showMessage("Passwords do not match.");
          return;
        }

        setLoading(registerForm, true);
        try {
          await Auth.register(username, email, password);
          showMessage("Account created! Redirecting...", "success");
          setTimeout(() => {
            window.location.href = "dashboard";
          }, 600);
        } catch (err) {
          showMessage(err.message);
        } finally {
          setLoading(registerForm, false);
        }
      });

      // Toggle password visibility
      document.getElementById("toggle-login-pw").addEventListener("click", () => {
        const pw = document.getElementById("login-password");
        pw.type = pw.type === "password" ? "text" : "password";
      });
      document.getElementById("toggle-register-pw").addEventListener("click", () => {
        const pw = document.getElementById("register-password");
        pw.type = pw.type === "password" ? "text" : "password";
      });
    })();
  </script>
</body>
</html>
